[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agy-mcp"
version = "0.2.0"
description = "MCP server for Antigravity IDE — skill management, config bridge, agent orchestration"
requires-python = ">=3.11"
dependencies = ["fastmcp>=3.4.4,<4"]

[project.scripts]
agy-mcp = "agy_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agy_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "ruff>=0.16.0,<0.17",
    "pre-commit>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
